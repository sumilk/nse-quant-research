[project]
name = "india-strategy-lab"
version = "0.1.0"
description = "Research lab for systematic strategies on Indian markets, built on the ML4T workflow"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "tabulate>=0.10.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "strategylab"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
lab = "strategylab.cli:main"
