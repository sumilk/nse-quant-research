# Dashboard:   docker compose up -d dashboard               -> http://localhost:8501
# Pipeline:    docker compose run --rm lab fetch
#              docker compose run --rm lab research --strategy india_etf_momentum
#              docker compose run --rm lab current  --strategy india_etf_momentum
# Holdout (once per strategy):
#              docker compose run --rm lab holdout --strategy india_etf_momentum --i-have-not-changed-anything

x-app: &app
  build:
    context: .
    target: runtime
  image: india-strategy-lab:latest
  volumes:
    - ./data:/app/data
    # Whole strategies/ tree: configs and pre-registrations on the host apply
    # without a rebuild, and results are written back to the host.
    - ./strategies:/app/strategies

services:
  dashboard:
    <<: *app
    ports:
      - "8501:8501"
    restart: unless-stopped

  lab:
    <<: *app
    entrypoint: ["lab"]
    command: ["list"]
    profiles: ["jobs"]
